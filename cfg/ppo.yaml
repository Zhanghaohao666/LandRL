algo:
  feature_extractor:
    learning_rate: 8e-5    # A1v2 微调：适度提高让加速度惩罚信号有效学习
    dyn_obs_num: 5

  actor:
    learning_rate: 8e-5    # A1v2 微调：适度提高让加速度惩罚信号有效学习
    clip_ratio: 0.1
    action_limit: 1.8 # m/s （动平台需要给 drone 留追踪 budget；平台 0.30 m/s + 自由速度 1.5 m/s）

  critic:
    learning_rate: 2e-4    # A1v2 微调：critic 需要跟上新奖励分布
    clip_ratio: 0.1

  entropy_loss_coefficient: 5e-3 # v1=2e-3, 提高探索防止过早收敛
  training_frame_num: 64
  training_epoch_num: 4
  num_minibatches: 16 # split into N minibatches
